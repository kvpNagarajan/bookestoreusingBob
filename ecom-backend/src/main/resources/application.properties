# ============================================================
# E-Commerce Backend — Application Configuration
# IBM Capstone Project
# ============================================================

spring.application.name=ecom-backend
server.port=8080

# Bind only to localhost (security: never 0.0.0.0)
server.address=127.0.0.1

# ============================================================
# PostgreSQL DataSource
# Credentials must be supplied via environment variables.
# NEVER hardcode passwords in this file.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecomdb}
spring.datasource.username=${DB_USERNAME:ecomuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT Configuration
# Secret must be >= 256-bit (32+ chars). Supply via env var.
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ============================================================
# SpringDoc / Swagger UI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ============================================================
# Logging
# Log to stdout in structured format — sensitive data MUST
# NOT appear in logs (see security policy).
# ============================================================
logging.level.root=INFO
logging.level.com.ibm.capstone.ecom=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
